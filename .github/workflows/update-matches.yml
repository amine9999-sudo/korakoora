name: Update KoraKoora Matches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Fetch football matches
      # =====================================================

      - name: Fetch football matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta


          # =================================================
          # Configuration
          # =================================================

          TOKEN = os.environ.get("FOOTBALL_DATA_TOKEN")

          if not TOKEN:
              raise SystemExit(
                  "ERROR: FOOTBALL_DATA_TOKEN is missing"
              )


          API = "https://api.football-data.org/v4"


          # =================================================
          # البطولات الأساسية
          #
          # سنجلب كل بطولة بطلب مستقل.
          # هذا يمنع سقوط Workflow بالكامل
          # إذا كانت بطولة معينة غير متاحة.
          # =================================================

          COMPETITIONS = [

              ("CL", "دوري أبطال أوروبا"),

              ("PL", "الدوري الإنجليزي"),

              ("PD", "الدوري الإسباني"),

              ("SA", "الدوري الإيطالي"),

              ("BL1", "الدوري الألماني"),

              ("FL1", "الدوري الفرنسي"),

              ("PPL", "الدوري البرتغالي"),

              ("DED", "الدوري الهولندي")

          ]


          # =================================================
          # التاريخ
          #
          # أمس + اليوم + الأيام القادمة
          # =================================================

          now = datetime.now(timezone.utc)

          date_from = (
              now - timedelta(days=1)
          ).strftime("%Y-%m-%d")

          date_to = (
              now + timedelta(days=9)
          ).strftime("%Y-%m-%d")


          print()
          print("=" * 70)
          print("KoraKoora Football Data Update")
          print("=" * 70)

          print(
              f"Date range: {date_from} -> {date_to}"
          )

          print()


          # =================================================
          # Fetch one competition
          # =================================================

          def fetch_competition(code, name):

              url = (
                  f"{API}/competitions/"
                  f"{code}/matches"
                  f"?dateFrom={date_from}"
                  f"&dateTo={date_to}"
              )


              request = urllib.request.Request(

                  url,

                  headers={
                      "X-Auth-Token": TOKEN,
                      "User-Agent": "KoraKoora/1.0"
                  }

              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      data = json.load(response)


                  matches = data.get(
                      "matches",
                      []
                  )


                  print(
                      f"OK  {code} - {name}: "
                      f"{len(matches)} matches"
                  )


                  return matches


              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="ignore"
                  )


                  print(
                      f"SKIP {code} - {name}: "
                      f"HTTP {error.code}"
                  )


                  if body:
                      print(
                          "API response:",
                          body[:500]
                      )


                  # لا نسقط Workflow بسبب بطولة واحدة
                  return []


              except Exception as error:

                  print(
                      f"SKIP {code} - {name}: "
                      f"{error}"
                  )


                  return []


          # =================================================
          # Download all competitions
          # =================================================

          all_matches = []


          for code, name in COMPETITIONS:

              matches = fetch_competition(
                  code,
                  name
              )


              all_matches.extend(
                  matches
              )


          print()


          # =================================================
          # Normalize matches
          # =================================================

          normalized = []


          for match in all_matches:

              competition = (
                  match.get("competition")
                  or {}
              )


              home_team = (
                  match.get("homeTeam")
                  or {}
              )


              away_team = (
                  match.get("awayTeam")
                  or {}
              )


              score = (
                  match.get("score")
                  or {}
              )


              half_time = (
                  score.get("halfTime")
                  or {}
              )


              full_time = (
                  score.get("fullTime")
                  or {}
              )


              normalized.append({

                  "id":
                      match.get("id"),

                  "status":
                      match.get("status"),

                  "utcDate":
                      match.get("utcDate"),

                  "matchday":
                      match.get("matchday"),

                  "stage":
                      match.get("stage"),


                  # =========================================
                  # Competition
                  # =========================================

                  "competition": {

                      "id":
                          competition.get("id"),

                      "name":
                          competition.get("name"),

                      "code":
                          competition.get("code"),

                      "emblem":
                          competition.get("emblem")

                  },


                  # =========================================
                  # Home team
                  # =========================================

                  "home": {

                      "id":
                          home_team.get("id"),

                      "name":
                          home_team.get("name"),

                      "shortName":
                          home_team.get("shortName"),

                      "tla":
                          home_team.get("tla"),

                      "crest":
                          home_team.get("crest")

                  },


                  # =========================================
                  # Away team
                  # =========================================

                  "away": {

                      "id":
                          away_team.get("id"),

                      "name":
                          away_team.get("name"),

                      "shortName":
                          away_team.get("shortName"),

                      "tla":
                          away_team.get("tla"),

                      "crest":
                          away_team.get("crest")

                  },


                  # =========================================
                  # Score
                  # =========================================

                  "score": {

                      "halfTime": {

                          "home":
                              half_time.get("home"),

                          "away":
                              half_time.get("away")

                      },

                      "fullTime": {

                          "home":
                              full_time.get("home"),

                          "away":
                              full_time.get("away")

                      }

                  }

              })


          # =================================================
          # Remove duplicate matches
          # =================================================

          unique_matches = {}


          for match in normalized:

              match_id = match.get("id")


              if match_id is not None:

                  unique_matches[
                      match_id
                  ] = match


          matches = list(
              unique_matches.values()
          )


          # =================================================
          # Sort by UTC date
          # =================================================

          matches.sort(

              key=lambda match:
                  match.get("utcDate") or ""

          )


          # =================================================
          # Competition priority
          # =================================================

          priority = {

              "CL": 1,

              "PL": 2,

              "PD": 3,

              "SA": 4,

              "BL1": 5,

              "FL1": 6,

              "PPL": 7,

              "DED": 8

          }


          matches.sort(

              key=lambda match: (

                  priority.get(

                      (

                          match.get(
                              "competition"
                          )

                          or {}

                      ).get("code"),

                      99

                  ),

                  match.get(
                      "utcDate"
                  ) or ""

              )

          )


          # =================================================
          # Output
          # =================================================

          output = {

              "updatedAt":
                  now.isoformat(),

              "dateFrom":
                  date_from,

              "dateTo":
                  date_to,

              "competitions": [

                  code

                  for code, name
                  in COMPETITIONS

              ],

              "count":
                  len(matches),

              "matches":
                  matches

          }


          # =================================================
          # Save file
          # =================================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/matches.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  output,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # =================================================
          # Final report
          # =================================================

          print()
          print("=" * 70)

          print(
              f"TOTAL MATCHES: {len(matches)}"
          )

          print("=" * 70)


          competition_counts = {}


          for match in matches:

              competition = (
                  match.get("competition")
                  or {}
              )


              code = (
                  competition.get("code")
                  or "UNKNOWN"
              )


              name = (
                  competition.get("name")
                  or code
              )


              competition_counts[name] = (

                  competition_counts.get(
                      name,
                      0
                  )

                  + 1

              )


          for name, count in sorted(
              competition_counts.items()
          ):

              print(
                  f"- {name}: {count}"
              )


          print("=" * 70)

          PY


      # =====================================================
      # 3. Verify JSON
      # =====================================================

      - name: Verify matches.json
        run: |

          python - <<'PY'

          import json

          path = "data/matches.json"


          with open(
              path,
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          matches = data.get(
              "matches",
              []
          )


          print("=" * 60)

          print(
              "KoraKoora verification"
          )

          print("=" * 60)


          print(
              "Total matches:",
              len(matches)
          )


          print(
              "Date from:",
              data.get("dateFrom")
          )


          print(
              "Date to:",
              data.get("dateTo")
          )


          if not isinstance(
              matches,
              list
          ):

              raise SystemExit(
                  "ERROR: matches is not a list"
              )


          for match in matches:

              if not match.get("id"):

                  raise SystemExit(
                      "ERROR: Match without ID"
                  )


              if not match.get("utcDate"):

                  raise SystemExit(
                      "ERROR: Match without utcDate"
                  )


          print()
          print(
              "JSON verification: OK"
          )

          PY


      # =====================================================
      # 4. Publish
      # =====================================================

      - name: Publish updated data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/matches.json


          if git diff --cached --quiet; then

              echo "No changes to commit."

          else

              git commit \
                -m "Update KoraKoora football matches"

              git push

          fi
