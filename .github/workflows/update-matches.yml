name: Update KoraKoora Matches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Download project
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Fetch football matches
      # =====================================================

      - name: Fetch football matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error

          from datetime import datetime, timezone, timedelta


          # =================================================
          # Configuration
          # =================================================

          TOKEN = os.environ.get("FOOTBALL_DATA_TOKEN")

          if not TOKEN:
              raise SystemExit(
                  "ERROR: FOOTBALL_DATA_TOKEN is missing"
              )


          API = "https://api.football-data.org/v4"


          # البطولات الرئيسية التي يعرضها KoraKoora
          COMPETITIONS = [
              "CL",      # دوري أبطال أوروبا
              "PL",      # الدوري الإنجليزي
              "PD",      # الدوري الإسباني
              "SA",      # الدوري الإيطالي
              "BL1",     # الدوري الألماني
              "FL1",     # الدوري الفرنسي
              "PPL",     # الدوري البرتغالي
              "DED"      # الدوري الهولندي
          ]


          # =================================================
          # Date range
          # =================================================
          #
          # مهم:
          #
          # app.js يحول UTC إلى توقيت الزائر.
          #
          # لذلك نحتاج إلى جلب نطاق أكبر من:
          #
          # أمس ← اليوم ← غدًا
          #
          # لضمان عدم فقدان أي مباراة عند اختلاف
          # المناطق الزمنية بين الزوار.
          #
          # نستخدم:
          #
          # - يومين قبل UTC
          # + عشرة أيام بعد UTC
          #
          # وهذا يعطي هامشًا آمنًا للمناطق الزمنية
          # المختلفة حول العالم.
          # =================================================

          now = datetime.now(timezone.utc)


          date_from = (
              now - timedelta(days=2)
          ).strftime("%Y-%m-%d")


          date_to = (
              now + timedelta(days=10)
          ).strftime("%Y-%m-%d")


          print(
              f"Fetching matches from {date_from} "
              f"to {date_to}"
          )


          # =================================================
          # Request helper
          # =================================================

          def fetch_matches():

              competitions = ",".join(
                  COMPETITIONS
              )


              url = (
                  f"{API}/matches"
                  f"?dateFrom={date_from}"
                  f"&dateTo={date_to}"
                  f"&competitions={competitions}"
              )


              print()
              print("Football API request:")
              print(url)
              print()


              request = urllib.request.Request(

                  url,

                  headers={

                      "X-Auth-Token":
                          TOKEN,

                      "User-Agent":
                          "KoraKoora/1.0"

                  }

              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      return json.load(
                          response
                      )


              except urllib.error.HTTPError as error:

                  print(
                      "Football API HTTP error:",
                      error.code
                  )


                  print(
                      error.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )


                  raise


              except Exception as error:

                  print(
                      "Football API request failed:",
                      error
                  )


                  raise


          data = fetch_matches()


          # =================================================
          # Process matches
          # =================================================

          matches = []


          for match in data.get(
              "matches",
              []
          ):

              competition = (
                  match.get("competition")
                  or {}
              )


              home_team = (
                  match.get("homeTeam")
                  or {}
              )


              away_team = (
                  match.get("awayTeam")
                  or {}
              )


              score = (
                  match.get("score")
                  or {}
              )


              half_time = (
                  score.get("halfTime")
                  or {}
              )


              full_time = (
                  score.get("fullTime")
                  or {}
              )


              matches.append({

                  "id":
                      match.get("id"),


                  "status":
                      match.get("status"),


                  "utcDate":
                      match.get("utcDate"),


                  "matchday":
                      match.get("matchday"),


                  "stage":
                      match.get("stage"),


                  # =========================================
                  # Competition
                  # =========================================

                  "competition": {

                      "id":
                          competition.get("id"),

                      "name":
                          competition.get("name"),

                      "code":
                          competition.get("code"),

                      "emblem":
                          competition.get("emblem")

                  },


                  # =========================================
                  # Home team
                  # =========================================

                  "home": {

                      "id":
                          home_team.get("id"),

                      "name":
                          home_team.get("name"),

                      "shortName":
                          home_team.get("shortName"),

                      "tla":
                          home_team.get("tla"),

                      "crest":
                          home_team.get("crest")

                  },


                  # =========================================
                  # Away team
                  # =========================================

                  "away": {

                      "id":
                          away_team.get("id"),

                      "name":
                          away_team.get("name"),

                      "shortName":
                          away_team.get("shortName"),

                      "tla":
                          away_team.get("tla"),

                      "crest":
                          away_team.get("crest")

                  },


                  # =========================================
                  # Score
                  # =========================================

                  "score": {

                      "halfTime": {

                          "home":
                              half_time.get("home"),

                          "away":
                              half_time.get("away")

                      },


                      "fullTime": {

                          "home":
                              full_time.get("home"),

                          "away":
                              full_time.get("away")

                      }

                  }

              })


          # =================================================
          # Remove duplicates
          # =================================================

          unique_matches = {}


          for match in matches:

              match_id = match.get(
                  "id"
              )


              if match_id is not None:

                  unique_matches[
                      match_id
                  ] = match


          matches = list(
              unique_matches.values()
          )


          # =================================================
          # Sort by date
          # =================================================

          matches.sort(

              key=lambda match:
                  match.get(
                      "utcDate"
                  ) or ""

          )


          # =================================================
          # Competition priority
          # =================================================

          priority = {

              "CL": 1,

              "PL": 2,

              "PD": 3,

              "SA": 4,

              "BL1": 5,

              "FL1": 6,

              "PPL": 7,

              "DED": 8

          }


          matches.sort(

              key=lambda match: (

                  priority.get(

                      (

                          match.get(
                              "competition"
                          )

                          or {}

                      ).get(
                          "code"
                      ),

                      99

                  ),

                  match.get(
                      "utcDate"
                  ) or ""

              )

          )


          # =================================================
          # Final output
          # =================================================

          output = {

              "updatedAt":
                  now.isoformat(),


              "dateFrom":
                  date_from,


              "dateTo":
                  date_to,


              "competitions":
                  COMPETITIONS,


              "count":
                  len(matches),


              "matches":
                  matches

          }


          # =================================================
          # Save JSON
          # =================================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(

              "data/matches.json",

              "w",

              encoding="utf-8"

          ) as file:

              json.dump(

                  output,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # =================================================
          # Debug information
          # =================================================

          print()
          print("=" * 60)

          print(
              f"KoraKoora: {len(matches)} matches fetched"
          )

          print("=" * 60)


          competition_counts = {}


          for match in matches:

              competition = (
                  match.get("competition")
                  or {}
              )


              code = (
                  competition.get("code")
                  or "UNKNOWN"
              )


              name = (
                  competition.get("name")
                  or code
              )


              competition_counts[name] = (

                  competition_counts.get(
                      name,
                      0
                  ) + 1

              )


          for name, count in (
              competition_counts.items()
          ):

              print(
                  f"- {name}: {count} matches"
              )


          print("=" * 60)


          PY


      # =====================================================
      # 3. Verify generated file
      # =====================================================

      - name: Verify matches.json
        run: |

          echo "======================================"
          echo "KoraKoora matches.json"
          echo "======================================"


          python - <<'PY'

          import json


          with open(

              "data/matches.json",

              encoding="utf-8"

          ) as file:

              data = json.load(file)


          print(
              "Total matches:",
              data.get("count", 0)
          )


          print(
              "Date from:",
              data.get("dateFrom")
          )


          print(
              "Date to:",
              data.get("dateTo")
          )


          print()
          print("Competitions:")


          competitions = {}


          for match in data.get(
              "matches",
              []
          ):

              competition = (
                  match.get("competition")
                  or {}
              )


              name = (
                  competition.get("name")
                  or "Unknown"
              )


              competitions[name] = (

                  competitions.get(
                      name,
                      0
                  ) + 1

              )


          for name, count in (
              competitions.items()
          ):

              print(
                  f"  {name}: {count}"
              )


          PY


      # =====================================================
      # 4. Publish updated data
      # =====================================================

      - name: Publish updated data
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/matches.json


          if git diff --cached --quiet; then

              echo "No changes to commit."

          else

              git commit \
                -m "Update KoraKoora football matches"


              git push

          fi
