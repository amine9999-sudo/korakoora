name: Update KoraKoora Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Fetch matches
      # =====================================================

      - name: Fetch football matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error

          from datetime import datetime, timezone, timedelta


          # =================================================
          # Configuration
          # =================================================

          TOKEN = os.environ.get("FOOTBALL_DATA_TOKEN")

          if not TOKEN:
              raise SystemExit(
                  "ERROR: FOOTBALL_DATA_TOKEN is missing"
              )

          API = "https://api.football-data.org/v4"


          # =================================================
          # Competitions
          # =================================================

          COMPETITIONS = [

              ("CL", "دوري أبطال أوروبا"),

              ("PL", "الدوري الإنجليزي"),

              ("PD", "الدوري الإسباني"),

              ("SA", "الدوري الإيطالي"),

              ("BL1", "الدوري الألماني"),

              ("FL1", "الدوري الفرنسي"),

              ("PPL", "الدوري البرتغالي"),

              ("DED", "الدوري الهولندي")

          ]


          # =================================================
          # Dates
          # =================================================

          now = datetime.now(timezone.utc)

          date_from = (
              now - timedelta(days=1)
          ).strftime("%Y-%m-%d")

          date_to = (
              now + timedelta(days=9)
          ).strftime("%Y-%m-%d")


          print("=" * 70)
          print("KoraKoora Data Update")
          print("=" * 70)

          print(
              f"Date range: {date_from} -> {date_to}"
          )


          # =================================================
          # API helper
          # =================================================

          def api_get(path):

              url = API + path

              request = urllib.request.Request(

                  url,

                  headers={
                      "X-Auth-Token": TOKEN,
                      "User-Agent": "KoraKoora/1.0"
                  }

              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      return json.load(response)

              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print(
                      f"HTTP ERROR {error.code}: {path}"
                  )

                  if body:
                      print(body[:500])

                  return None

              except Exception as error:

                  print(
                      f"REQUEST ERROR: {path}"
                  )

                  print(error)

                  return None


          # =================================================
          # Fetch matches
          # =================================================

          all_matches = []


          for code, name in COMPETITIONS:

              print()
              print(
                  f"Fetching matches: {code} - {name}"
              )

              path = (
                  f"/competitions/{code}/matches"
                  f"?dateFrom={date_from}"
                  f"&dateTo={date_to}"
              )

              data = api_get(path)

              if not data:

                  print(
                      f"SKIP {code}"
                  )

                  continue

              matches = data.get(
                  "matches",
                  []
              )

              print(
                  f"Found {len(matches)} matches"
              )

              all_matches.extend(matches)


          # =================================================
          # Normalize matches
          # =================================================

          normalized = []


          for match in all_matches:

              competition = (
                  match.get("competition")
                  or {}
              )

              home_team = (
                  match.get("homeTeam")
                  or {}
              )

              away_team = (
                  match.get("awayTeam")
                  or {}
              )

              score = (
                  match.get("score")
                  or {}
              )

              half_time = (
                  score.get("halfTime")
                  or {}
              )

              full_time = (
                  score.get("fullTime")
                  or {}
              )

              # ---------------------------------------------
              # Referee
              # ---------------------------------------------

              referees = (
                  match.get("referees")
                  or []
              )

              referee = None

              if referees:

                  first_referee = referees[0]

                  referee = {

                      "id":
                          first_referee.get("id"),

                      "name":
                          first_referee.get("name"),

                      "type":
                          first_referee.get("type"),

                      "nationality":
                          first_referee.get(
                              "nationality"
                          )

                  }


              normalized.append({

                  "id":
                      match.get("id"),

                  "status":
                      match.get("status"),

                  "utcDate":
                      match.get("utcDate"),

                  "matchday":
                      match.get("matchday"),

                  "stage":
                      match.get("stage"),

                  "venue":
                      match.get("venue"),

                  "referee":
                      referee,


                  "competition": {

                      "id":
                          competition.get("id"),

                      "name":
                          competition.get("name"),

                      "code":
                          competition.get("code"),

                      "emblem":
                          competition.get("emblem")

                  },


                  "home": {

                      "id":
                          home_team.get("id"),

                      "name":
                          home_team.get("name"),

                      "shortName":
                          home_team.get("shortName"),

                      "tla":
                          home_team.get("tla"),

                      "crest":
                          home_team.get("crest")

                  },


                  "away": {

                      "id":
                          away_team.get("id"),

                      "name":
                          away_team.get("name"),

                      "shortName":
                          away_team.get("shortName"),

                      "tla":
                          away_team.get("tla"),

                      "crest":
                          away_team.get("crest")

                  },


                  "score": {

                      "halfTime": {

                          "home":
                              half_time.get("home"),

                          "away":
                              half_time.get("away")

                      },

                      "fullTime": {

                          "home":
                              full_time.get("home"),

                          "away":
                              full_time.get("away")

                      }

                  }

              })


          # =================================================
          # Remove duplicates
          # =================================================

          unique_matches = {}


          for match in normalized:

              match_id = match.get("id")

              if match_id is not None:

                  unique_matches[
                      match_id
                  ] = match


          matches = list(
              unique_matches.values()
          )


          # =================================================
          # Sort
          # =================================================

          priority = {

              "CL": 1,
              "PL": 2,
              "PD": 3,
              "SA": 4,
              "BL1": 5,
              "FL1": 6,
              "PPL": 7,
              "DED": 8

          }


          matches.sort(

              key=lambda match: (

                  priority.get(

                      (
                          match.get(
                              "competition"
                          )
                          or {}
                      ).get("code"),

                      99

                  ),

                  match.get(
                      "utcDate"
                  ) or ""

              )

          )


          # =================================================
          # Save matches
          # =================================================

          matches_output = {

              "updatedAt":
                  now.isoformat(),

              "dateFrom":
                  date_from,

              "dateTo":
                  date_to,

              "competitions": [

                  code

                  for code, name
                  in COMPETITIONS

              ],

              "count":
                  len(matches),

              "matches":
                  matches

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/matches.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  matches_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              f"TOTAL MATCHES: {len(matches)}"
          )


          # =================================================
          # Fetch standings
          # =================================================

          standings_output = {

              "updatedAt":
                  now.isoformat(),

              "competitions": {}

          }


          for code, name in COMPETITIONS:

              print()
              print(
                  f"Fetching standings: {code}"
              )

              path = (
                  f"/competitions/"
                  f"{code}/standings"
              )

              data = api_get(path)

              if not data:

                  print(
                      f"SKIP standings {code}"
                  )

                  continue


              standings = data.get(
                  "standings",
                  []
              )


              # ---------------------------------------------
              # Prefer TOTAL table
              # ---------------------------------------------

              total_table = None


              for standing in standings:

                  if (
                      standing.get("type")
                      == "TOTAL"
                  ):

                      total_table = standing

                      break


              if total_table is None and standings:

                  total_table = standings[0]


              table = []


              if total_table:

                  for row in (
                      total_table.get(
                          "table",
                          []
                      )
                  ):

                      team = (
                          row.get("team")
                          or {}
                      )


                      table.append({

                          "position":
                              row.get("position"),

                          "team": {

                              "id":
                                  team.get("id"),

                              "name":
                                  team.get("name"),

                              "shortName":
                                  team.get("shortName"),

                              "tla":
                                  team.get("tla"),

                              "crest":
                                  team.get("crest")

                          },

                          "playedGames":
                              row.get(
                                  "playedGames"
                              ),

                          "won":
                              row.get("won"),

                          "draw":
                              row.get("draw"),

                          "lost":
                              row.get("lost"),

                          "points":
                              row.get("points"),

                          "goalsFor":
                              row.get("goalsFor"),

                          "goalsAgainst":
                              row.get("goalsAgainst"),

                          "goalDifference":
                              row.get(
                                  "goalDifference"
                              )

                      })


              standings_output[
                  "competitions"
              ][code] = {

                  "name":
                      name,

                  "competition":
                      data.get(
                          "competition"
                      ),

                  "season":
                      data.get(
                          "season"
                      ),

                  "table":
                      table

              }


              print(
                  f"Standings rows: {len(table)}"
              )


          # =================================================
          # Save standings
          # =================================================

          with open(
              "data/standings.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  standings_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # =================================================
          # Head to Head
          #
          # We only request it for the first few upcoming
          # matches to avoid hitting the API rate limit.
          # =================================================

          head2head_output = {

              "updatedAt":
                  now.isoformat(),

              "matches": {}

          }


          # ---------------------------------------------
          # Only scheduled / upcoming matches
          # ---------------------------------------------

          upcoming = [

              match

              for match in matches

              if match.get("status")
              in (
                  "SCHEDULED",
                  "TIMED"
              )

          ]


          # Limit requests
          # Free API plan has request throttling.

          upcoming = upcoming[:5]


          for match in upcoming:

              match_id = match.get("id")

              if not match_id:
                  continue


              print()
              print(
                  f"Fetching H2H: {match_id}"
              )


              path = (
                  f"/matches/"
                  f"{match_id}"
              )


              data = api_get(path)


              if not data:
                  continue


              h2h = (
                  data.get("head2head")
                  or {}
              )


              head2head_output[
                  "matches"
              ][str(match_id)] = h2h


          # =================================================
          # Save H2H
          # =================================================

          with open(
              "data/head2head.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  head2head_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # =================================================
          # Final
          # =================================================

          print()
          print("=" * 70)
          print("KoraKoora update completed")
          print(
              f"Matches: {len(matches)}"
          )
          print(
              "Standings:",
              len(
                  standings_output[
                      "competitions"
                  ]
              )
          )
          print(
              "H2H:",
              len(
                  head2head_output[
                      "matches"
                  ]
              )
          )
          print("=" * 70)

          PY


      # =====================================================
      # 3. Verify data
      # =====================================================

      - name: Verify generated JSON files

        run: |

          python - <<'PY'

          import json
          import os


          files = [

              "data/matches.json",

              "data/standings.json",

              "data/head2head.json"

          ]


          for path in files:

              print()
              print(
                  f"Checking {path}"
              )


              if not os.path.exists(path):

                  raise SystemExit(
                      f"ERROR: Missing {path}"
                  )


              with open(
                  path,
                  encoding="utf-8"
              ) as file:

                  data = json.load(file)


              if not isinstance(
                  data,
                  dict
              ):

                  raise SystemExit(
                      f"ERROR: {path} is not a JSON object"
                  )


              print("OK")


          # -----------------------------------------------
          # Matches validation
          # -----------------------------------------------

          with open(
              "data/matches.json",
              encoding="utf-8"
          ) as file:

              matches_data = json.load(file)


          matches = matches_data.get(
              "matches",
              []
          )


          if not isinstance(
              matches,
              list
          ):

              raise SystemExit(
                  "ERROR: matches is not a list"
              )


          for match in matches:

              if not match.get("id"):

                  raise SystemExit(
                      "ERROR: Match without ID"
                  )

              if not match.get("utcDate"):

                  raise SystemExit(
                      "ERROR: Match without utcDate"
                  )


          print()
          print(
              f"Matches verified: {len(matches)}"
          )


          # -----------------------------------------------
          # Standings validation
          # -----------------------------------------------

          with open(
              "data/standings.json",
              encoding="utf-8"
          ) as file:

              standings_data = json.load(file)


          competitions = standings_data.get(
              "competitions",
              {}
          )


          if not isinstance(
              competitions,
              dict
          ):

              raise SystemExit(
                  "ERROR: standings competitions invalid"
              )


          print(
              "Standings competitions:",
              len(competitions)
          )


          print()
          print(
              "All JSON verification: OK"
          )

          PY


      # =====================================================
      # 4. Publish
      # =====================================================

      - name: Publish updated data

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/matches.json \
            data/standings.json \
            data/head2head.json


          if git diff --cached --quiet; then

              echo "No changes to commit."

          else

              git commit \
                -m "Update KoraKoora football data"

              git push

          fi
