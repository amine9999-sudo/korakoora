name: Update football matches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch today's matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          # توقيت المغرب
          tz = ZoneInfo("Africa/Casablanca")
          now = datetime.now(tz)

          today = now.strftime("%Y-%m-%d")

          # جلب مباريات اليوم
          params = urllib.parse.urlencode({
              "dateFrom": today,
              "dateTo": today
          })

          url = "https://api.football-data.org/v4/matches?" + params

          request = urllib.request.Request(
              url,
              headers={
                  "X-Auth-Token": os.environ["FOOTBALL_DATA_TOKEN"],
                  "User-Agent": "KoraKoora"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

          except Exception as error:
              print("API ERROR:", error)
              raise

          matches = []

          for match in data.get("matches", []):

              home_team = match.get("homeTeam") or {}
              away_team = match.get("awayTeam") or {}

              status = match.get("status")

              # تحويل حالات المباراة إلى الحالات التي يفهمها الموقع
              if status in ["IN_PLAY", "PAUSED"]:
                  site_status = "LIVE"

              elif status == "FINISHED":
                  site_status = "FINISHED"

              else:
                  site_status = "TIMED"

              score = match.get("score") or {}

              full_time = score.get("fullTime") or {}

              matches.append({
                  "id": match.get("id"),

                  "status": site_status,

                  "utcDate": match.get("utcDate"),

                  "competition": (
                      (match.get("competition") or {}).get("name")
                  ),

                  "home": home_team.get("name"),

                  "away": away_team.get("name"),

                  "homeLogo": home_team.get("crest"),

                  "awayLogo": away_team.get("crest"),

                  "homeScore": full_time.get("home"),

                  "awayScore": full_time.get("away")
              })

          output = {
              "updatedAt": datetime.now().astimezone().isoformat(),
              "matches": matches
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/matches.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Matches found:", len(matches))

          PY

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json

          git diff --cached --quiet || \
            git commit -m "Update football matches"

          git push
