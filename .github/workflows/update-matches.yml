name: Update football matches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch football matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          token = os.environ.get("FOOTBALL_DATA_TOKEN")

          if not token:
              raise SystemExit("FOOTBALL_DATA_TOKEN is missing")

          now = datetime.now(timezone.utc)

          # اليوم + 9 أيام قادمة
          date_from = now.strftime("%Y-%m-%d")
          date_to = (now + timedelta(days=9)).strftime("%Y-%m-%d")

          url = (
              "https://api.football-data.org/v4/matches"
              f"?dateFrom={date_from}&dateTo={date_to}"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "X-Auth-Token": token,
                  "User-Agent": "KoraKoora"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

          except urllib.error.HTTPError as e:
              print("Football API error:", e.code)
              print(e.read().decode("utf-8", errors="ignore"))
              raise

          matches = []

          for match in data.get("matches", []):
              score = match.get("score") or {}
              full_time = score.get("fullTime") or {}
              half_time = score.get("halfTime") or {}

              competition = match.get("competition") or {}
              home_team = match.get("homeTeam") or {}
              away_team = match.get("awayTeam") or {}

              matches.append({
                  "id": match.get("id"),
                  "status": match.get("status"),
                  "utcDate": match.get("utcDate"),

                  "competition": {
                      "id": competition.get("id"),
                      "name": competition.get("name"),
                      "code": competition.get("code")
                  },

                  "home": {
                      "id": home_team.get("id"),
                      "name": home_team.get("name"),
                      "shortName": home_team.get("shortName"),
                      "crest": home_team.get("crest")
                  },

                  "away": {
                      "id": away_team.get("id"),
                      "name": away_team.get("name"),
                      "shortName": away_team.get("shortName"),
                      "crest": away_team.get("crest")
                  },

                  "score": {
                      "halfTime": {
                          "home": half_time.get("home"),
                          "away": half_time.get("away")
                      },
                      "fullTime": {
                          "home": full_time.get("home"),
                          "away": full_time.get("away")
                      }
                  }
              })

          matches.sort(key=lambda x: x.get("utcDate") or "")

          output = {
              "updatedAt": now.isoformat(),
              "dateFrom": date_from,
              "dateTo": date_to,
              "count": len(matches),
              "matches": matches
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/matches.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Successfully fetched {len(matches)} matches.")
          print(f"From: {date_from}")
          print(f"To:   {date_to}")
          PY

      - name: Show generated data
        run: |
          echo "===== matches.json ====="
          cat data/matches.json

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football matches"
            git push
          fi
