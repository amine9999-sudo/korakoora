<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#111111">
  <title>ترتيب البطولة | KoraKoora</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .league-page { padding: 40px 0 70px; }
    .league-hero {
      background: #11151e;
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: 0 16px 45px rgba(0,0,0,.18);
    }
    .league-hero h1 { margin: 10px 0 4px; color:#fff; font-size:clamp(28px,5vw,44px); }
    .league-meta { color:#8992a3; }
    .standings-card {
      overflow: hidden;
      background:#11151e;
      border:1px solid rgba(255,255,255,.065);
      border-radius:20px;
      box-shadow:0 16px 45px rgba(0,0,0,.18);
    }
    .standings-scroll { overflow-x:auto; }
    .standings-table { width:100%; min-width:720px; border-collapse:collapse; }
    .standings-table th,
    .standings-table td { padding:13px 12px; border-bottom:1px solid rgba(255,255,255,.06); text-align:center; white-space:nowrap; }
    .standings-table th { color:#8992a3; font-size:12px; background:#171c27; }
    .standings-table td { color:#e9edf5; font-size:14px; }
    .standings-table tbody tr:hover { background:rgba(255,255,255,.025); }
    .team-cell { display:flex; align-items:center; gap:10px; min-width:220px; text-align:right; }
    .team-cell img { width:30px; height:30px; object-fit:contain; }
    .position { font-weight:900; color:#3d8bff !important; width:55px; }
    .points { font-weight:900; color:#19c37d !important; }
    .empty-standings { padding:50px 20px; text-align:center; color:#8992a3; }
    .league-back { display:inline-flex; margin-bottom:18px; padding:10px 16px; border-radius:10px; background:#171c27; color:#fff; }
    @media(max-width:700px){ .league-hero{padding:22px 16px;border-radius:18px;} .standings-table{min-width:680px;} .team-cell{min-width:190px;} }
  </style>
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">Kora<span>Koora</span></a>
    <nav aria-label="القائمة الرئيسية">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#matches">المباريات</a>
      <a class="active" href="index.html#leagues">البطولات</a>
    </nav>
  </div>
</header>

<main class="league-page">
  <div class="container">
    <a class="league-back" href="index.html#leagues">← العودة إلى البطولات</a>
    <section class="league-hero">
      <p class="eyebrow">ترتيب البطولة</p>
      <h1 id="leagueName">جاري التحميل...</h1>
      <div id="leagueMeta" class="league-meta"></div>
    </section>
    <section class="standings-card">
      <div id="standingsContainer" class="standings-scroll">
        <div class="empty-standings">جاري تحميل الترتيب...</div>
      </div>
    </section>
  </div>
</main>

<script>
const STANDINGS_FILE = "data/standings.json";
const LEAGUE_NAMES = {
  CL:"دوري أبطال أوروبا", PL:"الدوري الإنجليزي", PD:"الدوري الإسباني",
  SA:"الدوري الإيطالي", BL1:"الدوري الألماني", FL1:"الدوري الفرنسي",
  PPL:"الدوري البرتغالي", DED:"الدوري الهولندي"
};

function getCode(){ return new URLSearchParams(location.search).get("code") || "PL"; }
function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
}

async function loadStandings(){
  const code = getCode();
  const name = LEAGUE_NAMES[code] || code;
  document.title = `${name} | KoraKoora`;
  document.querySelector("#leagueName").textContent = name;

  const container = document.querySelector("#standingsContainer");
  try {
    const response = await fetch(`${STANDINGS_FILE}?v=${Date.now()}`, {cache:"no-store"});
    if(!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    const item = data?.competitions?.[code];
    const rows = item?.table || [];

    const season = item?.season || {};
    document.querySelector("#leagueMeta").textContent =
      rows.length ? `الموسم الحالي · ${item.stage || ""}` : "";

    if(!rows.length){
      container.innerHTML = `<div class="empty-standings">لا توجد بيانات ترتيب متاحة حاليًا. سيتم تحديثها تلقائيًا من مصدر البيانات.</div>`;
      return;
    }

    container.innerHTML = `
      <table class="standings-table">
        <thead>
          <tr>
            <th>#</th><th>الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>الفارق</th><th>النقاط</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => {
            const team = row.team || {};
            const logo = team.crest ? `<img src="${esc(team.crest)}" alt="" loading="lazy" onerror="this.style.display='none'">` : "";
            return `
              <tr>
                <td class="position">${esc(row.position)}</td>
                <td><div class="team-cell">${logo}<span>${esc(team.shortName || team.name || "فريق")}</span></div></td>
                <td>${esc(row.playedGames)}</td>
                <td>${esc(row.won)}</td>
                <td>${esc(row.draw)}</td>
                <td>${esc(row.lost)}</td>
                <td>${esc(row.goalsFor)}</td>
                <td>${esc(row.goalsAgainst)}</td>
                <td>${esc(row.goalDifference)}</td>
                <td class="points">${esc(row.points)}</td>
              </tr>`;
          }).join("")}
        </tbody>
      </table>`;
  } catch(error){
    console.error(error);
    container.innerHTML = `<div class="empty-standings">تعذر تحميل ترتيب البطولة حاليًا.</div>`;
  }
}

loadStandings();
</script>
</body>
</html>
