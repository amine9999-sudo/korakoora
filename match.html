<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="description" content="تفاصيل مباراة كرة القدم، الموعد، النتيجة، البطولة، القنوات الناقلة والمعلومات المتاحة.">
  <meta name="theme-color" content="#111111">
  <title>تفاصيل المباراة | KoraKoora</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .match-page { padding: 40px 0 70px; }
    .back-button { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 10px 16px; border-radius: 8px; background: #181d27; color: #fff; text-decoration: none; font-weight: bold; border: 1px solid rgba(255,255,255,0.08); }
    .back-button:hover { background: #202735; }

    .match-details-card {
      background: #11151e;
      color: #f5f7fb;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .match-details-card h2 { color: #ffffff; }
    .match-details-card strong { color: #f5f7fb; }

    .match-details-top { text-align: center; margin-bottom: 30px; }
    .competition-name {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      background: #181d27;
      color: #f5f7fb;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .match-date { color: #8992a3; margin: 8px 0; }

    .match-details-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 25px;
      max-width: 850px;
      margin: 0 auto;
    }
    .details-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .details-team img { width: 90px; height: 90px; object-fit: contain; }
    .details-team-name { font-size: 20px; font-weight: bold; color: #ffffff; }

    .details-center { text-align: center; min-width: 150px; }
    .details-time { font-size: 30px; font-weight: bold; margin-bottom: 10px; color: #ffffff; }
    .details-score {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
    }
    .details-score strong { font-size: 25px; color: #ffffff; }

    .details-status {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 13px;
      border-radius: 20px;
      background: #181d27;
      color: #f5f7fb;
      font-size: 14px;
      font-weight: bold;
    }
    .details-status.live { background: rgba(255,77,88,0.15); color: #ff6b75; }
    .details-status.finished { background: rgba(66,203,133,0.12); color: #69d49a; }
    .details-status.upcoming { background: rgba(61,139,255,0.12); color: #3d8bff; }

    .details-section { margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.06); }
    .details-section h2 { margin-bottom: 20px; font-size: 21px; color: #ffffff; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .info-box {
      background: #181d27;
      border-radius: 12px;
      padding: 17px;
      color: #f5f7fb;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .info-box span { display: block; color: #8992a3; font-size: 13px; margin-bottom: 7px; }
    .info-box strong { font-size: 16px; color: #ffffff; }

    .placeholder-box {
      padding: 20px;
      background: #181d27;
      border-radius: 12px;
      color: #737d8e;
      line-height: 1.9;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* ===== القنوات الناقلة ===== */
    .broadcast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .broadcast-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: #181d27;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }
    .broadcast-card:hover {
      background: #1b2230;
      border-color: rgba(61,139,255,0.2);
      transform: translateY(-2px);
    }
    .broadcast-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .broadcast-info { flex: 1; }
    .broadcast-info strong {
      display: block;
      color: #ffffff;
      font-size: 15px;
      margin-bottom: 3px;
    }
    .broadcast-info span {
      color: #8992a3;
      font-size: 12px;
    }
    .broadcast-action {
      padding: 8px 14px;
      border-radius: 8px;
      background: #2878ed;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .broadcast-note {
      margin-top: 16px;
      padding: 14px 16px;
      background: rgba(40,120,237,0.08);
      border: 1px solid rgba(40,120,237,0.15);
      border-radius: 12px;
      color: #3d8bff;
      font-size: 13px;
      line-height: 1.7;
    }
    .broadcast-note i { margin-left: 6px; }

    .loading-details { text-align: center; padding: 70px 20px; }
    .loading-details .loader {
      width: 38px; height: 38px;
      border: 4px solid rgba(255,255,255,0.08);
      border-top-color: #3d8bff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-details { text-align: center; padding: 60px 20px; }
    .error-details h2 { margin-bottom: 10px; color: #ffffff; }
    .home-link {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 20px;
      background: #2878ed;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .team-logo-fallback {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      color: #fff; font-size: 2.5rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== قائمة الجوال ===== */
    .nav-menu {
      display: flex;
      gap: 25px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-menu li a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .nav-menu li a:hover { color: #3d8bff; }

    @media (max-width: 768px) {
      .nav-menu {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        flex-direction: column;
        background: #11151e;
        padding: 20px;
        gap: 15px;
        border-radius: 0 0 16px 16px;
        border: 1px solid rgba(255,255,255,0.06);
        border-top: 0;
        transform: translateY(-10px);
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        z-index: 100;
      }
      .nav-menu.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: all;
      }
      .mobile-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
      }
      .match-teams-scoreboard { flex-direction: column; padding: 30px 15px; }
      .main-score { font-size: 3rem; order: -1; margin-bottom: 20px; }
      .team-logo-fallback { width: 70px; height: 70px; font-size: 2rem; }
      .details-team-name { font-size: 1.2rem; }
      .info-grid { grid-template-columns: 1fr; }
      .broadcast-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">Kora<span>Koora</span></a>
    <button class="mobile-menu-btn" aria-label="القائمة" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>
    <nav aria-label="القائمة الرئيسية">
      <ul class="nav-menu">
        <li><a href="index.html">الرئيسية</a></li>

  </div>

<main class="match-page">
  <div class="container">

        <div class="loader"></div>
        <p>جاري تحميل تفاصيل المباراة...</p>

    </div>
  </div>
</main>

<footer>
  <div class="container footer">
    <div>
      <a class="brand" href="index.html">Kora<span>Koora</span></a>
      <p>مباريات ونتائج ومعلومات كرة القدم بطريقة واضحة.</p>
    </div>
    <div class="footer-links">
      <a href="pages/about.html">من نحن</a>
      <a href="pages/contact.html">اتصل بنا</a>
      <a href="pages/privacy.html">سياسة الخصوصية</a>

  </div>
  <div class="copyright">© 2026 KoraKoora — جميع الحقوق محفوظة</div>
</footer>

const H2H_FILE = "head2head.json";

    { name: "CBS Sports", region: "الولايات المتحدة", icon: "🇺🇸", color: "#0f3460", link: "https://www.cbssports.com" },
    { name: "Paramount+", region: "أمريكا", icon: "⛰️", color: "#1a237e", link: "https://www.paramountplus.com" }
  ],

  ],
  "DED": [
    { name: "ESPN", region: "هولندا", icon: "🇳🇱", color: "#1a237e", link: "https://www.espn.com" },

  ],

    { name: "StarzPlay", region: "الشرق الأوسط", icon: "⭐", color: "#1e1e2e", link: "https://www.starzplay.com" },
    { name: "DAZN", region: "أوروبا", icon: "⚡", color: "#111", link: "https://www.dazn.com" }
  ]
};

function getBroadcasters(leagueCode) {
  return BROADCASTERS[leagueCode] || BROADCASTERS["DEFAULT"];
}

function renderBroadcasters(leagueCode) {
  const channels = getBroadcasters(leagueCode);
  return `
    <section class="details-section">
      <h2>📺 القنوات الناقلة الرسمية</h2>
      <div class="broadcast-grid">
        ${channels.map(ch => `
          <a href="${ch.link}" target="_blank" rel="noopener noreferrer" class="broadcast-card">
            <div class="broadcast-icon" style="background:${ch.color}">${ch.icon}</div>
            <div class="broadcast-info">
              <strong>${ch.name}</strong>
              <span>${ch.region}</span>
            </div>
            <div class="broadcast-action">اشتراك</div>
          </a>
        `).join('')}
      </div>
      <div class="broadcast-note">
        <i>ℹ️</i> KoraKoora لا يقدم بثاً مباشراً للمباريات. نعرض لك فقط القنوات والمنصات الرسمية التي تمتلك حقوق النشر. يرجى الاشتراك في المنصة المناسبة لمنطقتك.
      </div>
    </section>
  `;
}

function getUserTimeZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
  catch { return "UTC"; }
}

function formatTime(utc) {
  if (!utc) return "--:--";
  try {
    return new Intl.DateTimeFormat("ar-MA", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: getUserTimeZone()
    }).format(new Date(utc));
  } catch { return "--:--"; }
}

function formatDate(utc) {
  if (!utc) return "--";
  try {
    return new Intl.DateTimeFormat("ar-MA", {
      weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: getUserTimeZone()
    }).format(new Date(utc));
  } catch { return "--"; }
}

function getMatchId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

const LEAGUE_NAMES = {
  "Premier League": "الدوري الإنجليزي",
  "Primera Division": "الدوري الإسباني",
  "La Liga": "الدوري الإسباني",
  "Serie A": "الدوري الإيطالي",
  "Bundesliga": "الدوري الألماني",
  "Ligue 1": "الدوري الفرنسي",
  "Primeira Liga": "الدوري البرتغالي",
  "Eredivisie": "الدوري الهولندي",
  "UEFA Champions League": "دوري أبطال أوروبا",
  "Champions League": "دوري أبطال أوروبا",
  "Europa League": "الدوري الأوروبي",
  "Conference League": "دوري المؤتمر الأوروبي",
  "Botola Pro": "الدوري المغربي",
  "Botola": "الدوري المغربي",
  "Egyptian Premier League": "الدوري المصري",
  "Saudi Pro League": "الدوري السعودي",
  "Saudi Professional League": "الدوري السعودي"
};

const LEAGUE_CODES = {
  "Premier League": "PL", "English Premier League": "PL",
  "Primera Division": "PD", "La Liga": "PD",
  "Serie A": "SA",
  "Bundesliga": "BL1",
  "Ligue 1": "FL1",
  "Primeira Liga": "PPL",
  "Eredivisie": "DED",
  "UEFA Champions League": "CL", "Champions League": "CL"
};

function getCompetitionName(match) {
  const competition = match.competition;
  if (!competition) return "بطولة";
  if (typeof competition === "object") {
    const name = competition.name || competition.code || "بطولة";
    return LEAGUE_NAMES[name] || name;
  }
  return LEAGUE_NAMES[competition] || competition;
}

function getCompetitionCode(match) {
  const competition = match.competition;
  if (!competition) return "";
  let name = "";
  if (typeof competition === "object") name = competition.name || competition.code || "";
  else name = competition;
  return LEAGUE_CODES[name] || "";
}

function getTeam(team) {
  if (!team) return { name: "فريق", logo: "" };
  const name = team.name || team.shortName || team.tla || "فريق";
  const logo = team.crest || team.logo || team.image || team.crestUrl || "";
  return { name, logo };
}

function getStatus(match) {
  const status = String(match.status || "").toUpperCase();
  if (["LIVE","IN_PLAY","PAUSED","1H","2H","HT","ET","P"].includes(status)) {
    return { className: "live", text: "🔴 مباشر" };
  }
  if (status === "FINISHED") return { className: "finished", text: "✓ انتهت" };
  if (status === "POSTPONED") return { className: "upcoming", text: "⚠️ تأجلت" };
  if (status === "CANCELLED") return { className: "upcoming", text: "⚠️ ألغيت" };
  if (status === "TIMED" || status === "SCHEDULED") return { className: "upcoming", text: "🕐 مؤكدة" };
  return { className: "upcoming", text: "🕐 لم تبدأ" };
}

function getScore(match) {
  const score = match.score || {};
  const fullTime = score.fullTime || {};
  return {
    home: fullTime.home ?? match.homeScore ?? null,
    away: fullTime.away ?? match.awayScore ?? null
  };
}

function renderTeam(team) {
  const fallback = `<div class="team-logo-fallback">${team.name.charAt(0)}</div>`;
  const img = team.logo
    ? `<img src="${team.logo}" alt="شعار ${team.name}" onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('afterbegin', '${fallback.replace(/"/g, '&quot;')}');">`
    : fallback;
  return `
    <div class="details-team">
      ${img}
      <div class="details-team-name">${team.name}</div>
    </div>
  `;
}

async function loadMatch() {
  const container = document.querySelector("#matchDetails");
  const matchId = getMatchId();
  if (!matchId) { showError("لم يتم العثور على رقم المباراة."); return; }

  try {
    const response = await fetch(`${API_FILE}?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const matches = Array.isArray(data.matches) ? data.matches : [];
    const match = matches.find(item => String(item.id) === String(matchId));
    if (!match) { showError("لم يتم العثور على هذه المباراة في البيانات الحالية."); return; }
    renderMatchDetails(match);
    loadHeadToHead(matchId);
  } catch (error) {
    console.error("Match details error:", error);
    showError("حدث خطأ أثناء تحميل تفاصيل المباراة.");
  }
}

function renderMatchDetails(match) {
  const container = document.querySelector("#matchDetails");
  const home = getTeam(match.homeTeam || match.home);
  const away = getTeam(match.awayTeam || match.away);
  const score = getScore(match);
  const status = getStatus(match);
  const competition = getCompetitionName(match);
  const leagueCode = getCompetitionCode(match);
  const isFinished = status.className === "finished";
  const hasScore = score.home !== null && score.away !== null;

  const center = hasScore
    ? `<div class="details-score"><span>${score.home}</span><strong>-</strong><span>${score.away}</span></div>`
    : `<div class="details-time">${formatTime(match.utcDate)}</div>`;

  container.innerHTML = `
    <article class="match-details-card">
      <div class="match-details-top">
        <div class="competition-name">🏆 ${competition}</div>
        <div class="match-date">${formatDate(match.utcDate)}</div>
        <div style="color:#8992a3;font-size:13px;">بتوقيت ${getUserTimeZone()}</div>
      </div>
      <div class="match-details-teams">
        ${renderTeam(home)}
        <div class="details-center">
          ${center}
          <div class="details-status ${status.className}">${status.text}</div>
        </div>
        ${renderTeam(away)}
      </div>
      <section class="details-section">
        <h2>معلومات المباراة</h2>
        <div class="info-grid">
          <div class="info-box"><span>البطولة</span><strong>${competition}</strong></div>
          <div class="info-box"><span>موعد المباراة</span><strong>${formatTime(match.utcDate)}</strong></div>
          <div class="info-box"><span>تاريخ المباراة</span><strong>${formatDate(match.utcDate)}</strong></div>
          <div class="info-box"><span>حالة المباراة</span><strong>${status.text}</strong></div>
          ${match.matchday ? `<div class="info-box"><span>الجولة</span><strong>الجولة ${match.matchday}</strong></div>` : ""}
          ${match.stage ? `<div class="info-box"><span>المرحلة</span><strong>${match.stage}</strong></div>` : ""}
        </div>
      </section>
      ${renderBroadcasters(leagueCode)}
      <section class="details-section">
        <h2>الحكم</h2>
        <div class="placeholder-box">معلومات الحكم ستظهر هنا عندما تكون متوفرة في مصدر البيانات.</div>
      </section>
      <section class="details-section">
        <h2>آخر المواجهات بين الفريقين</h2>
        <div id="h2hContent" class="placeholder-box">جاري تحميل المواجهات السابقة...</div>
      </section>
      <section class="details-section">
        <h2>التشكيلات والأحداث</h2>
        <div class="placeholder-box">التشكيلات، الأهداف، البطاقات، التبديلات والإحصائيات ستظهر هنا عندما تصبح متاحة من مصدر البيانات.</div>
      </section>
    </article>
  `;
  document.title = `${home.name} × ${away.name} | KoraKoora`;
}

async function loadHeadToHead(matchId) {
  const container = document.querySelector("#h2hContent");
  if (!container) return;
  try {
    const response = await fetch(`${H2H_FILE}?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const matches = Array.isArray(data.matches) ? data.matches : Array.isArray(data) ? data : [];
    const currentResponse = await fetch(`${API_FILE}?v=${Date.now()}`, { cache: "no-store" });
    if (!currentResponse.ok) throw new Error(`HTTP ${currentResponse.status}`);
    const currentData = await currentResponse.json();
    const allMatches = Array.isArray(currentData.matches) ? currentData.matches : [];
    const currentMatch = allMatches.find(item => String(item.id) === String(matchId));
    if (!currentMatch) { container.innerHTML = "لم يتم العثور على المباراة."; return; }
    const homeId = currentMatch.homeTeam?.id ?? currentMatch.home?.id;
    const awayId = currentMatch.awayTeam?.id ?? currentMatch.away?.id;
    const homeName = currentMatch.homeTeam?.name || currentMatch.home?.name || "";
    const awayName = currentMatch.awayTeam?.name || currentMatch.away?.name || "";
    const normalize = value => String(value || "").trim().toLowerCase();
    const sameTeam = (team, id, name) => {
      if (team?.id != null && id != null) return String(team.id) === String(id);
      return normalize(team?.name) === normalize(name);
    };
    const h2h = matches.filter(item => {
      const itemHome = item.homeTeam || item.home;
      const itemAway = item.awayTeam || item.away;
      if (!itemHome || !itemAway) return false;
      return (
        (sameTeam(itemHome, homeId, homeName) && sameTeam(itemAway, awayId, awayName)) ||
        (sameTeam(itemHome, awayId, awayName) && sameTeam(itemAway, homeId, homeName))
      );
    });
    if (h2h.length === 0) { container.innerHTML = "لا توجد مواجهات سابقة متاحة بين الفريقين."; return; }
    container.innerHTML = h2h.slice(0, 5).map(match => {
      const home = getTeam(match.homeTeam || match.home);
      const away = getTeam(match.awayTeam || match.away);
      const score = getScore(match);
      return `
        <div style="padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <strong style="color:#f5f7fb;">${home.name}</strong>
            <strong style="color:#ffffff;">${score.home ?? "-"} - ${score.away ?? "-"}</strong>
            <strong style="color:#f5f7fb;">${away.name}</strong>
          </div>
          <div style="text-align:center; margin-top:6px; font-size:12px; color:#8992a3;">${formatDate(match.utcDate)}</div>
        </div>
      `;
    }).join("");
  } catch (error) {
    console.error("H2H error:", error);
    container.innerHTML = "تعذر تحميل المواجهات السابقة حاليًا.";
  }
}

function showError(message) {
  const container = document.querySelector("#matchDetails");
  container.innerHTML = `
    <div class="match-details-card error-details">
      <div style="font-size:50px;">⚠️</div>
      <h2>تعذر تحميل المباراة</h2>
      <p>${message}</p>
      <a href="index.html#matches" class="home-link">العودة إلى المباريات</a>
    </div>
  `;
}
