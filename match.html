<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="description" content="تفاصيل مباراة كرة القدم، الموعد، النتيجة، البطولة، حالة المباراة والمعلومات المتاحة.">
  <meta name="theme-color" content="#111111">
  <title>تفاصيل المباراة | KoraKoora</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================================
       صفحة تفاصيل المباراة
       ===================================================== */

    .match-page { padding: 40px 0 70px; }
    .back-button { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 10px 16px; border-radius: 8px; background: #222; color: #fff; text-decoration: none; font-weight: bold; }
    .back-button:hover { opacity: .85; }
    .match-details-card { background: #fff; border-radius: 18px; padding: 30px; box-shadow: 0 10px 35px rgba(0,0,0,.08); border: 1px solid rgba(0,0,0,.06); }
    .match-details-top { text-align: center; margin-bottom: 30px; }
    .competition-name { display: inline-block; margin-bottom: 12px; padding: 7px 14px; border-radius: 20px; background: #f2f2f2; font-size: 14px; font-weight: bold; }
    .match-date { color: #666; margin: 8px 0; }
    .match-details-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 25px; max-width: 850px; margin: 0 auto; }
    .details-team { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    .details-team img { width: 90px; height: 90px; object-fit: contain; }
    .details-team-name { font-size: 20px; font-weight: bold; }
    .details-center { text-align: center; min-width: 150px; }
    .details-time { font-size: 30px; font-weight: bold; margin-bottom: 10px; }
    .details-score { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 38px; font-weight: 900; }
    .details-score strong { font-size: 25px; }
    .details-status { display: inline-block; margin-top: 10px; padding: 6px 13px; border-radius: 20px; background: #f1f1f1; font-size: 14px; font-weight: bold; }
    .details-status.live { background: #ffe5e5; color: #d00000; }
    .details-status.finished { background: #e8f7ed; color: #16803c; }
    .details-status.upcoming { background: #eef3ff; color: #315fc4; }

    /* ===== العداد التنازلي - تصميم احترافي ===== */
    .match-countdown {
      font-size: 28px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: #1a1a2e;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 50px;
      padding: 10px 28px;
      margin: 12px auto 8px;
      display: inline-block;
      letter-spacing: 3px;
      direction: ltr;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      min-width: 160px;
    }

    .match-countdown.live {
      color: #ff1744;
      border-color: rgba(255, 23, 68, 0.3);
      background: rgba(255, 23, 68, 0.06);
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.08);
      animation: live-pulse 1.4s ease-in-out infinite;
    }

    .match-countdown.finished {
      color: #00c853;
      border-color: rgba(0, 200, 83, 0.3);
      background: rgba(0, 200, 83, 0.06);
    }

    .match-countdown.postponed,
    .match-countdown.cancelled {
      color: #ffab00;
      border-color: rgba(255, 171, 0, 0.3);
      background: rgba(255, 171, 0, 0.06);
    }

    .match-countdown.waiting {
      color: #78909c;
      border-color: rgba(120, 144, 156, 0.2);
      background: rgba(120, 144, 156, 0.04);
    }

    @keyframes live-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.15); }
      50% { box-shadow: 0 0 30px 8px rgba(255, 23, 68, 0.06); }
      100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.15); }
    }

    .match-countdown::before {
      content: "🕐 ";
      font-size: 22px;
      font-weight: 400;
    }

    .match-countdown.live::before {
      content: "🔴 ";
      animation: blink-dot 1s step-end infinite;
    }

    .match-countdown.finished::before {
      content: "✅ ";
    }

    .match-countdown.postponed::before {
      content: "⏳ ";
    }

    .match-countdown.cancelled::before {
      content: "🚫 ";
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 700px) {
      .match-countdown {
        font-size: 22px;
        padding: 8px 18px;
        min-width: 130px;
        letter-spacing: 2px;
      }
      .match-countdown::before {
        font-size: 18px;
      }
    }

    @media (max-width: 450px) {
      .match-countdown {
        font-size: 18px;
        padding: 6px 14px;
        min-width: 110px;
        letter-spacing: 1px;
      }
      .match-countdown::before {
        font-size: 15px;
      }
    }

    .details-section { margin-top: 35px; padding-top: 25px; border-top: 1px solid #eee; }
    .details-section h2 { margin-bottom: 20px; font-size: 21px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    .info-box { background: #f8f8f8; border-radius: 12px; padding: 17px; }
    .info-box span { display: block; color: #777; font-size: 13px; margin-bottom: 7px; }
    .info-box strong { font-size: 16px; }
    .placeholder-box { padding: 20px; background: #fafafa; border-radius: 12px; color: #777; line-height: 1.9; }
    .loading-details { text-align: center; padding: 70px 20px; }
    .loading-details .loader { width: 38px; height: 38px; border: 4px solid #ddd; border-top-color: #19c37d; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-details { text-align: center; padding: 60px 20px; }
    .error-details h2 { margin-bottom: 10px; }
    .home-link { display: inline-block; margin-top: 20px; padding: 11px 20px; background: #19c37d; color: #fff; border-radius: 8px; text-decoration: none; font-weight: bold; }

    @media (max-width: 700px) {
      .match-details-card { padding: 20px 12px; }
      .match-details-teams { gap: 8px; }
      .details-team img { width: 65px; height: 65px; }
      .details-team-name { font-size: 15px; }
      .details-time { font-size: 21px; }
      .details-score { font-size: 28px; }
      .details-center { min-width: 90px; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">Kora<span>Koora</span></a>
    <nav aria-label="القائمة الرئيسية">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#matches">مباريات اليوم</a>
      <a href="index.html#leagues">البطولات</a>
      <a href="index.html#news">أخبار وتحليلات</a>
    </nav>
  </div>
</header>

<main class="match-page">
  <div class="container">
    <a href="index.html#matches" class="back-button">← العودة إلى المباريات</a>
    <div id="matchDetails">
      <div class="loading-details">
        <div class="loader"></div>
        <p>جاري تحميل تفاصيل المباراة...</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container footer">
    <div>
      <a class="brand" href="index.html">Kora<span>Koora</span></a>
      <p>مباريات ونتائج ومعلومات كرة القدم بطريقة واضحة.</p>
    </div>
    <div class="footer-links">
      <a href="pages/about.html">من نحن</a>
      <a href="pages/contact.html">اتصل بنا</a>
      <a href="pages/privacy.html">سياسة الخصوصية</a>
      <a href="pages/terms.html">شروط الاستخدام</a>
    </div>
  </div>
  <div class="copyright">© 2026 KoraKoora — جميع الحقوق محفوظة</div>
</footer>

<script>
const API_FILE = "data/matches.json";

function getUserTimeZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch { return "UTC"; }
}

function formatTime(utc) {
  if (!utc) return "--:--";
  try {
    return new Intl.DateTimeFormat("ar-MA", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: getUserTimeZone() }).format(new Date(utc));
  } catch { return "--:--"; }
}

function formatDate(utc) {
  if (!utc) return "--";
  try {
    return new Intl.DateTimeFormat("ar-MA", { weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: getUserTimeZone() }).format(new Date(utc));
  } catch { return "--"; }
}

function getMatchId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

const LEAGUE_NAMES = {
  "Premier League": "الدوري الإنجليزي", "Primera Division": "الدوري الإسباني", "La Liga": "الدوري الإسباني",
  "Serie A": "الدوري الإيطالي", "Bundesliga": "الدوري الألماني", "Ligue 1": "الدوري الفرنسي",
  "Primeira Liga": "الدوري البرتغالي", "Eredivisie": "الدوري الهولندي",
  "UEFA Champions League": "دوري أبطال أوروبا", "Champions League": "دوري أبطال أوروبا",
  "Europa League": "الدوري الأوروبي", "Conference League": "دوري المؤتمر الأوروبي",
  "Botola Pro": "الدوري المغربي", "Botola": "الدوري المغربي",
  "Egyptian Premier League": "الدوري المصري", "Saudi Pro League": "الدوري السعودي"
};

function getCompetitionName(match) {
  const comp = match.competition;
  if (!comp) return "بطولة";
  if (typeof comp === "object") {
    const name = comp.name || comp.code || "بطولة";
    return LEAGUE_NAMES[name] || name;
  }
  return LEAGUE_NAMES[comp] || comp;
}

function getTeam(team) {
  if (!team) return { name: "فريق", logo: "" };
  return {
    name: team.name || team.shortName || team.tla || "فريق",
    logo: team.crest || team.logo || team.image || ""
  };
}

function getStatus(match) {
  const status = String(match.status || "").toUpperCase();
  const live = ["LIVE", "IN_PLAY", "PAUSED", "1H", "2H", "HT", "ET", "P"];
  if (live.includes(status)) return { className: "live", text: "🔴 مباشر" };
  if (status === "FINISHED") return { className: "finished", text: "✓ انتهت" };
  if (status === "POSTPONED") return { className: "upcoming", text: "⚠️ تأجلت" };
  if (status === "CANCELLED") return { className: "upcoming", text: "⚠️ ألغيت" };
  return { className: "upcoming", text: "🕐 لم تبدأ" };
}

function getScore(match) {
  const score = match.score || {};
  const fullTime = score.fullTime || {};
  return { home: fullTime.home ?? match.homeScore ?? null, away: fullTime.away ?? match.awayScore ?? null };
}

function getCountdownInfo(utcDate, status) {
  if (!utcDate) return { text: "00 : 00 : 00", className: "waiting" };

  const statusUpper = String(status || "").toUpperCase();
  const finished = ["FINISHED", "POSTPONED", "CANCELLED", "SUSPENDED"];
  const live = ["LIVE", "IN_PLAY", "PAUSED", "1H", "2H", "HT", "ET", "P"];

  if (finished.includes(statusUpper)) {
    if (statusUpper === "FINISHED") return { text: "انتهت", className: "finished" };
    if (statusUpper === "POSTPONED") return { text: "تأجلت", className: "postponed" };
    if (statusUpper === "CANCELLED") return { text: "ألغيت", className: "cancelled" };
    return { text: "متوقفة", className: "waiting" };
  }
  if (live.includes(statusUpper)) {
    return { text: "مباشر الآن", className: "live" };
  }

  const now = new Date().getTime();
  const matchTime = new Date(utcDate).getTime();
  let diff = matchTime - now;
  if (diff < 0) return { text: "00 : 00 : 00", className: "waiting" };

  const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
  const m = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
  const s = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
  return { text: `${h} : ${m} : ${s}`, className: "upcoming" };
}

function renderTeam(team) {
  return `<div class="details-team">
    ${team.logo ? `<img src="${team.logo}" alt="شعار ${team.name}" onerror="this.style.display='none';">` : `<div style="font-size:55px;">⚽</div>`}
    <div class="details-team-name">${team.name}</div>
  </div>`;
}

async function loadMatch() {
  const container = document.querySelector("#matchDetails");
  const matchId = getMatchId();

  if (!matchId) {
    showError("لم يتم العثور على رقم المباراة.");
    return;
  }

  try {
    const response = await fetch(`${API_FILE}?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const matches = Array.isArray(data.matches) ? data.matches : [];
    const match = matches.find(item => String(item.id) === String(matchId));

    if (!match) {
      showError("لم يتم العثور على هذه المباراة في البيانات الحالية.");
      return;
    }
    renderMatchDetails(match);

  } catch (error) {
    console.error("Match details error:", error);
    showError("حدث خطأ أثناء تحميل تفاصيل المباراة.");
  }
}

function renderMatchDetails(match) {
  const container = document.querySelector("#matchDetails");
  const home = getTeam(match.home);
  const away = getTeam(match.away);
  const score = getScore(match);
  const status = getStatus(match);
  const competition = getCompetitionName(match);
  const isFinished = status.className === "finished";

  const center = isFinished
    ? `<div class="details-score"><span>${score.home ?? "-"}</span><strong>-</strong><span>${score.away ?? "-"}</span></div>`
    : `<div class="details-time">${formatTime(match.utcDate)}</div>`;

  const countdownInfo = getCountdownInfo(match.utcDate, match.status);

  container.innerHTML = `
    <article class="match-details-card">
      <div class="match-details-top">
        <div class="competition-name">🏆 ${competition}</div>
        <div class="match-date">${formatDate(match.utcDate)}</div>
        <div style="color:#777;font-size:13px;">بتوقيت ${getUserTimeZone()}</div>
      </div>

      <div class="match-details-teams">
        ${renderTeam(home)}
        <div class="details-center">
          ${center}
          <div id="countdownDisplay" class="match-countdown ${countdownInfo.className}">${countdownInfo.text}</div>
          <div class="details-status ${status.className}">${status.text}</div>
        </div>
        ${renderTeam(away)}
      </div>

      <section class="details-section">
        <h2>معلومات المباراة</h2>
        <div class="info-grid">
          <div class="info-box"><span>البطولة</span><strong>${competition}</strong></div>
          <div class="info-box"><span>موعد المباراة</span><strong>${formatTime(match.utcDate)}</strong></div>
          <div class="info-box"><span>تاريخ المباراة</span><strong>${formatDate(match.utcDate)}</strong></div>
          <div class="info-box"><span>حالة المباراة</span><strong>${status.text}</strong></div>
          ${match.matchday ? `<div class="info-box"><span>الجولة</span><strong>الجولة ${match.matchday}</strong></div>` : ""}
          ${match.stage ? `<div class="info-box"><span>المرحلة</span><strong>${match.stage}</strong></div>` : ""}
        </div>
      </section>

      <section class="details-section"><h2>الحكم</h2><div class="placeholder-box">معلومات الحكم ستظهر هنا عندما تكون متوفرة في مصدر البيانات.</div></section>
      <section class="details-section"><h2>القنوات الناقلة</h2><div class="placeholder-box">معلومات القنوات الناقلة تعتمد على توفرها في مصدر البيانات.</div></section>
      <section class="details-section"><h2>آخر المواجهات بين الفريقين</h2><div class="placeholder-box">سيتم عرض المواجهات السابقة بين الفريقين بعد إضافة مصدر بيانات يدعم سجل المواجهات.</div></section>
      <section class="details-section"><h2>التشكيلات والأحداث</h2><div class="placeholder-box">التشكيلات، الأهداف، البطاقات، التبديلات والإحصائيات ستظهر هنا عندما تصبح متاحة من مصدر البيانات.</div></section>
    </article>
  `;

  document.title = `${home.name} × ${away.name} | KoraKoora`;

  function updateCountdown() {
    const el = document.getElementById('countdownDisplay');
    if (!el) return;
    const info = getCountdownInfo(match.utcDate, match.status);
    el.textContent = info.text;
    el.className = `match-countdown ${info.className}`;
  }

  updateCountdown();
  const interval = setInterval(updateCountdown, 1000);
  window.addEventListener('beforeunload', () => clearInterval(interval));
}

function showError(message) {
  const container = document.querySelector("#matchDetails");
  container.innerHTML = `
    <div class="match-details-card error-details">
      <div style="font-size:50px;">⚠️</div>
      <h2>تعذر تحميل المباراة</h2>
      <p>${message}</p>
      <a href="index.html#matches" class="home-link">العودة إلى المباريات</a>
    </div>
  `;
}

loadMatch();
</script>

</body>
</html>
